<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inline Style 屬性 — CaveDuck</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c0c;--bg2:#111;--bg3:#171717;--bg4:#1d1d1d;
  --border:#222;--border2:#1a1a1a;
  --text:#ddd;--muted:#aaa;--dim:#2a2a2a;
  --card-bg:#0e0e0e;--code-bg:#080808;--deny-bg:#0c0808;}
[data-theme="light"]{
  --bg:#f5f5f0;--bg2:#eeede8;--bg3:#e6e5e0;--bg4:#dddcd8;
  --border:#d0cfca;--border2:#dddcd8;
  --text:#1a1a1a;--muted:#aaa;--dim:#ccc;
  --card-bg:#ffffff;--code-bg:#f4f3ef;--deny-bg:#fdf2f2;
  --green:#1e7a47;--green-bg:#e6f5ec;--green-bd:#b8dec7;
  --blue:#1a6db5;--blue-bg:#e8f1fb;--blue-bd:#b3cef0;
  --yellow:#b07d00;--yellow-bg:#fdf8e6;--yellow-bd:#e8d68a;
}
:root{
  --green:#3ec97a;--green-bg:#061410;--green-bd:#0d2818;
  --blue:#4da8f0;--blue-bg:#060c18;--blue-bd:#0c1e38;
  --yellow:#f0c14d;--yellow-bg:#141008;--yellow-bd:#2a2008;
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:'SF Mono','Fira Code','Cascadia Code',ui-monospace,monospace;font-size:13px;line-height:1.6;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#444;border-radius:2px}

.hd{padding:.8rem 1.4rem;border-bottom:2px solid var(--border);
  background:linear-gradient(180deg,#101010,#0a0a0a);display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.hd-back{font-size:10px;color:var(--muted);background:var(--bg3);border:1px solid var(--border);
  border-radius:4px;padding:3px 10px;letter-spacing:.04em;transition:color .15s}
.hd-back:hover{color:var(--text)}
.hd-title{font-size:16px;font-weight:700;letter-spacing:.04em}
.hd-sub{font-size:10px;color:var(--muted);letter-spacing:.06em}
.theme-btn{margin-left:auto;background:var(--bg3);border:1px solid var(--border);
  border-radius:6px;padding:4px 10px;font-size:11px;color:var(--muted);cursor:pointer;
  font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.theme-btn:hover{color:var(--text);border-color:var(--muted)}
[data-theme="dark"] .theme-btn::before{content:"☀️"}
[data-theme="light"] .theme-btn::before{content:"🌙"}

.notice{padding:.5rem 1.4rem;background:var(--bg2);border-bottom:1px solid var(--border2);
  font-size:10px;color:var(--muted);display:flex;align-items:center;gap:.5rem}
.notice strong{color:var(--text)}

.ctrl{padding:.6rem 1.2rem;border-bottom:1px solid var(--border2);
  display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;background:var(--bg2)}
input[type=search]{background:#0a0a0a;border:1px solid var(--border);border-radius:5px;
  color:var(--text);font-family:inherit;font-size:12px;padding:4px 10px;outline:none;min-width:180px}
input[type=search]:focus{border-color:#444}
input[type=search]::placeholder{color:var(--dim)}
.ft-bar{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:2px}
.ft{padding:3px 12px;border-radius:3px;border:none;background:transparent;color:var(--muted);
  font-family:inherit;font-size:10px;cursor:pointer;transition:all .15s}
.ft:hover{color:var(--text)}.ft.on{background:var(--bg4);color:var(--text)}
.ft .cnt{font-size:9px;opacity:.7;margin-left:3px}

.stats{display:flex;gap:.5rem;padding:.5rem 1.2rem;border-bottom:1px solid var(--border2);flex-wrap:wrap}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:.2rem .65rem;display:flex;align-items:center;gap:.4rem}
.sn{font-size:13px;font-weight:600}.sl{font-size:10px;color:var(--muted)}
.sn.g{color:var(--green)}.sn.b{color:var(--blue)}.sn.t{color:var(--text)}

.main{flex:1;min-height:0;overflow-y:auto;padding:1rem 1.2rem 3rem}

/* Cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.65rem}
.prop-card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;
  padding:.8rem .9rem;display:flex;flex-direction:column;gap:.45rem}
.prop-card.both{border-left:3px solid var(--green)}
.prop-card.chat{border-left:3px solid var(--blue)}
.prop-name{font-size:12px;font-weight:700;letter-spacing:.03em;font-family:monospace}
.prop-name.g{color:var(--green)}.prop-name.b{color:var(--blue)}
.prop-desc{font-size:10px;color:var(--muted);line-height:1.5}
.prop-code{background:var(--code-bg);border:1px solid var(--border2);border-radius:4px;
  padding:4px 40px 4px 8px;font-size:9px;color:#a8d8a8;font-family:monospace;
  position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.copy-btn{position:absolute;top:2px;right:4px;font-size:8px;color:var(--muted);
  background:var(--bg3);border:1px solid var(--border);border-radius:3px;
  padding:1px 5px;cursor:pointer;font-family:inherit;transition:color .15s}
.copy-btn:hover{color:var(--text)}.copy-btn.ok{color:var(--green);border-color:var(--green-bd)}

/* Cold tab */
.cold-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.4rem}
.cold-item{background:var(--card-bg);border:1px solid var(--border);border-radius:6px;
  padding:.55rem .75rem;display:flex;flex-direction:column;gap:.2rem;opacity:.7}
.cold-name{font-size:10px;font-weight:700;font-family:monospace;color:var(--muted)}
.cold-name.ok{color:var(--green)}
.cold-desc{font-size:9.5px;color:var(--muted)}
.cold-note{font-size:8px;color:var(--dim);margin-top:1px}

.empty{color:var(--muted);font-size:12px;padding:2rem;text-align:center}
.loading{color:var(--muted);font-size:11px;padding:2rem;text-align:center}
.sec-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding:.4rem 0 .5rem;border-bottom:1px solid var(--border2);
  margin-bottom:.6rem;margin-top:1rem}
.sec-lbl:first-child{margin-top:0}
</style>
</head>
<body>
<div class="hd">
  <a href="index.html" class="hd-back">← 返回</a>
  <div class="hd-title">🎨 Inline Style 可用屬性</div>
  <div class="hd-sub">style="" 可以寫什麼 · What can you write in style=""</div>
  <button class="theme-btn" id="themeToggle"> 切換背景 / Theme</button>
</div>
<div class="notice">
  <strong>聊天室</strong>：所有 CSS 屬性均可用（DOMPurify 不過濾 inline style）&nbsp;·&nbsp;
  <strong>角色介面</strong>：使用 FilterCSS 白名單，僅允許部分屬性
</div>
<div class="ctrl">
  <input type="search" id="q" placeholder="搜尋屬性名稱… / Search property…">
  <div class="ft-bar">
    <button class="ft on" data-f="both">兩者可用 / Both <span class="cnt">71</span></button>
    <button class="ft" data-f="chat">僅聊天室 / Chat only <span class="cnt">45</span></button>
    <button class="ft" data-f="cold">冷門 / Less common <span class="cnt">159</span></button>
  </div>
</div>
<div class="stats">
  <div class="stat"><span class="sn g" id="s-both">71</span><span class="sl">兩者可用</span></div>
  <div class="stat"><span class="sn b" id="s-chat">45</span><span class="sl">僅聊天室</span></div>
  <div class="stat"><span class="sn t" id="s-cold">159</span><span class="sl">冷門</span></div>
</div>
<div class="main" id="main-area">
  <div id="cards-area"></div>
</div>

let curF='both', curQ='';
const _snips=[];

function copyText(text,btn){
  navigator.clipboard.writeText(text).then(()=>{
    btn.textContent='✓';btn.classList.add('ok');
    setTimeout(()=>{btn.textContent='複製';btn.classList.remove('ok');},1500);
  });
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderCard(item, cls, nc){
  const idx=_snips.push(item.e)-1;
  return `<div class="prop-card ${cls}">
    <div class="prop-name ${nc}">${esc(item.p)}</div>
    <div class="prop-desc">${esc(item.d)}</div>
    <div class="prop-code">${esc(item.e)}<button class="copy-btn" data-idx="${idx}" onclick="copyText(_snips[+this.dataset.idx],this)">複製</button></div>
  </div>`;
}

function renderCold(items){
  const q=curQ.toLowerCase();
  const filtered=q?items.filter(i=>i.p.includes(q)||i.d.includes(q)):items;
  if(!filtered.length)return '<div class="empty">沒有符合的項目</div>';
  // Group by ✓/✗
  const ok=filtered.filter(i=>i.s==='✓'), bad=filtered.filter(i=>i.s!=='✓');
  let html='';
  if(ok.length){
    html+=`<div class="sec-lbl">角色介面允許（${ok.length}）</div><div class="cold-grid">`;
    html+=ok.map(i=>`<div class="cold-item"><div class="cold-name ok">${esc(i.p)}</div><div class="cold-desc">${esc(i.d)}</div></div>`).join('');
    html+='</div>';
  }
  if(bad.length){
    html+=`<div class="sec-lbl">角色介面封鎖（${bad.length}）</div><div class="cold-grid">`;
    html+=bad.map(i=>`<div class="cold-item"><div class="cold-name">${esc(i.p)}</div><div class="cold-desc">${esc(i.d)}</div></div>`).join('');
    html+='</div>';
  }
  return html;
}

function render(){
  const q=curQ.toLowerCase();
  const area=document.getElementById('cards-area');
  if(curF==='cold'){area.innerHTML=renderCold(COLD);return;}
  const src=curF==='both'?BOTH:CHAT;
  const cls=curF==='both'?'both':'chat';
  const nc=curF==='both'?'g':'b';
  const filtered=q?src.filter(i=>i.p.includes(q)||i.d.toLowerCase().includes(q)):src;
  if(!filtered.length){area.innerHTML='<div class="empty">沒有符合的項目</div>';return;}
  area.innerHTML='<div class="card-grid">'+filtered.map(i=>renderCard(i,cls,nc)).join('')+'</div>';
}

document.getElementById('q').addEventListener('input',e=>{curQ=e.target.value;render();});
document.querySelectorAll('.ft').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.ft').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');curF=b.dataset.f;render();
}));
render();
</script>
<script>
(function(){
  var btn=document.getElementById('themeToggle');
  var html=document.documentElement;
  var saved=localStorage.getItem('cd-theme');
  if(saved)html.setAttribute('data-theme',saved);
  else html.setAttribute('data-theme','dark');
  btn.addEventListener('click',function(){
    var next=html.getAttribute('data-theme')==='dark'?'light':'dark';
    html.setAttribute('data-theme',next);
    localStorage.setItem('cd-theme',next);
  });
})();
</script>
