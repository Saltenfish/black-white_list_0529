<title>HTML 標籤 — CaveDuck</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c0c;--bg2:#111;--bg3:#171717;--bg4:#1d1d1d;
  --border:#222;--border2:#1a1a1a;
  --text:#ddd;--muted:#aaa;--dim:#2a2a2a;
  --green:#3ec97a;--green-bg:#061410;--green-bd:#0d2818;
  --red:#e86050;--red-bg:#140806;--red-bd:#280f08;
  --blue:#4da8f0;--blue-bg:#060c18;--blue-bd:#0c1e38;
  --yellow:#f0c14d;--yellow-bg:#141008;--yellow-bd:#2a2008;
  --card-bg:#0e0e0e;--code-bg:#080808;--deny-bg:#0c0808;}
/* ── Light theme ── */
[data-theme="light"]{
  --bg:#f5f5f0;--bg2:#eeede8;--bg3:#e6e5e0;--bg4:#dddcd8;
  --border:#d0cfca;--border2:#dddcd8;
  --text:#1a1a1a;--muted:#aaa;--dim:#ccc;
  --card-bg:#ffffff;--code-bg:#f4f3ef;--deny-bg:#fdf2f2;
  --green:#1e7a47;--green-bg:#e6f5ec;--green-bd:#b8dec7;
  --red:#c0392b;--red-bg:#fdecea;--red-bd:#f5b8b3;
  --blue:#1a6db5;--blue-bg:#e8f1fb;--blue-bd:#b3cef0;
  --yellow:#b07d00;--yellow-bg:#fdf8e6;--yellow-bd:#e8d68a;
  --purple:#6b3fa0;--purple-bg:#f2eafa;--purple-bd:#cdb0e8;
  --teal:#1a8a84;--teal-bg:#e6f5f4;--teal-bd:#9dd6d3;
  --orange:#c0541a;--orange-bg:#fdf0ea;--orange-bd:#f0bfa0;
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:'SF Mono','Fira Code','Cascadia Code',ui-monospace,monospace;
  font-size:13px;line-height:1.6;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#444;border-radius:2px}
.hd{padding:.8rem 1.4rem;border-bottom:2px solid var(--border);
  background:linear-gradient(180deg,#101010,#0a0a0a);display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.hd-back{font-size:10px;color:var(--muted);background:var(--bg3);border:1px solid var(--border);
  border-radius:4px;padding:3px 10px;letter-spacing:.04em;transition:color .15s}
.hd-back:hover{color:var(--text)}
.hd-title{font-size:16px;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:.5rem}
.hd-accent{color:var(--green);font-size:12px}
.hd-sub{font-size:10px;color:var(--muted);letter-spacing:.06em}
.ctrl{padding:.6rem 1.2rem;border-bottom:1px solid var(--border2);
  display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;background:var(--bg2)}
input[type=search]{background:#0a0a0a;border:1px solid var(--border);border-radius:5px;
  color:var(--text);font-family:inherit;font-size:12px;padding:4px 10px;outline:none;min-width:180px}
input[type=search]:focus{border-color:#333}
input[type=search]::placeholder{color:var(--dim)}
.ft-bar{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:2px}
.ft{padding:2px 10px;border-radius:3px;border:none;background:transparent;color:var(--muted);
  font-family:inherit;font-size:10px;cursor:pointer;transition:all .15s}
.ft:hover{color:var(--text)}.ft.on{background:var(--bg4);color:var(--text)}
.ct-label{font-size:10px;color:var(--muted)}
.stats{display:flex;gap:.5rem;padding:.5rem 1.2rem;border-bottom:1px solid var(--border2);flex-wrap:wrap}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:.2rem .65rem;display:flex;align-items:center;gap:.4rem}
.sn{font-size:13px;font-weight:600}.sl{font-size:10px;color:var(--muted)}
.sn.t{color:var(--text)}.sn.g{color:var(--green)}.sn.r{color:var(--red)}.sn.b{color:var(--blue)}.sn.y{color:var(--yellow)}
.main{flex:1;min-height:0;overflow-y:auto;padding:1rem 1.2rem 3rem}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.7rem}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:.85rem;display:flex;flex-direction:column;gap:.5rem}
.card.both{border-left:3px solid var(--green)}
.card.creator-only{border-left:3px solid var(--blue)}
.card.chat-only{border-left:3px solid var(--yellow)}
.card.deny{border-left:3px solid var(--red);background:var(--deny-bg)}
.card.unknown{border-left:3px solid var(--border);opacity:.7}
.c-head{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.c-name{font-size:13px;font-weight:700}
.c-name.g{color:var(--green)}.c-name.r{color:var(--red)}.c-name.b{color:var(--blue)}.c-name.y{color:var(--yellow)}.c-name.w{color:var(--text)}
.pill{font-size:9px;padding:1px 6px;border-radius:3px;letter-spacing:.04em;font-weight:600}
.pill.g{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.pill.r{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.pill.b{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bd)}
.pill.y{background:var(--yellow-bg);color:var(--yellow);border:1px solid var(--yellow-bd)}
.pill.m{background:var(--bg3);color:var(--muted);border:1px solid var(--border)}
.c-attrs{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.attr-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:3px}
.attr-chip{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--bg3);color:#ccc;border:1px solid var(--border)}
.prev-wrap{border:1px solid var(--border);border-radius:5px;overflow:hidden}
.prev-lbl{font-size:9px;color:var(--muted);padding:3px 8px;background:var(--code-bg);border-bottom:1px solid var(--border);letter-spacing:.06em}
.prev-body{background:#f0f0f0;padding:6px 10px;font-family:sans-serif;font-size:13px;color:#222;min-height:30px;max-height:120px;overflow:auto}
.code-wrapper {
  position: relative;
  width: 100%;
}
.c-code {
  background: var(--code-bg);
  border: 1px solid var(--border2);
  border-radius: 5px;
  padding: .4rem .6rem;
  padding-right: 3.5rem; /* 留空間給右邊的按鈕，程式碼就不會穿透過去 */
  font-size: 10px;
  color: #a8d8a8;
  overflow-x: auto;
  white-space: pre;
}
.copy-btn {
  position: absolute;
  top: 6px;              /* 微調垂直置中位置 */
  right: 6px;             /* 牢牢釘在右側 */
  font-size: 8px;
  color: var(--muted);
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 6px;
  cursor: pointer;
  font-family: inherit;
  transition: color .15s;
  z-index: 10;           /* 確保按鈕永遠在程式碼文字上方 */
}
.copy-btn:hover{color:var(--text)}.copy-btn.ok{color:var(--green);border-color:var(--green-bd)}
.empty{color:var(--dim);font-size:12px;padding:2rem;text-align:center}
.loading{color:var(--muted);font-size:11px;padding:2rem;text-align:center;letter-spacing:.06em}
.err{color:var(--red);font-size:11px;padding:2rem;text-align:center}

.theme-btn{margin-left:auto;background:var(--bg3);border:1px solid var(--border);
  border-radius:6px;padding:4px 10px;font-size:11px;color:var(--muted);cursor:pointer;
  font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.theme-btn:hover{color:var(--text);border-color:var(--muted)}
[data-theme="dark"] .theme-btn::before{content:"☀️"}
[data-theme="light"] .theme-btn::before{content:"🌙"}
.c-desc{font-size:10px;color:var(--muted);line-height:1.6;padding:.1rem 0}
.cat-sep{grid-column:1/-1;height:0;border-top:1px dashed var(--border2);margin:.3rem 0}
</style>
</head>

<div class="hd">
  <a href="index.html" class="hd-back">← 返回</a>
  <div class="hd-title"><span class="hd-accent">🏷️</span> HTML 標籤
</div>

</div>

    <button class="ft" data-f="creator">僅角色介面 / Char. page</button>
    <button class="ft" data-f="deny">不支援 / None</button>
  </div>
</div>
<div class="stats">

  <div class="stat"><span class="sn g" id="s-both">—</span><span class="sl">兩者皆可 / Both</span></div>

  <div class="stat"><span class="sn r" id="s-deny">—</span><span class="sl">不支援 / None</span></div>
</div>
<div class="main">
  <div id="cards" class="card-grid"></div>
  <div id="empty" class="empty" style="display:none">沒有符合的項目</div>
</div>

function parseCSV(text){
  if(text.charCodeAt(0)===0xFEFF)text=text.slice(1);
  const lines=text.split(/\r?\n/);
  const headers=parseLine(lines[0]);
  const rows=[];
  for(let i=1;i<lines.length;i++){
    const l=lines[i].trim();if(!l)continue;
    const vals=parseLine(l);const obj={};
    headers.forEach((h,j)=>obj[h.trim()]=(vals[j]||'').trim());
    rows.push(obj);
  }
  return rows;
}
function parseLine(line){
  const cells=[];let cell='',q=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='"'){if(q&&line[i+1]==='"'){cell+='"';i++;}else q=!q;}
    else if(c===','&&!q){cells.push(cell);cell='';}
    else cell+=c;
  }
  cells.push(cell);return cells;
}
async function fetchCSV(path){
  const r=await fetch(path);
  if(!r.ok)throw new Error('無法讀取: '+path);
  return parseCSV(await r.text());
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

let allTags=[], curFilter='all', curQ='';
function statusOrder(s){return{both:0,chat:1,creator:2,deny:3}[s]??4}

async function init(){
  document.getElementById('cards').innerHTML='<div class="loading">載入中…</div>';
  try{
    const [rows01,rowsDom,rowsXss]=await Promise.all([
      fetchCSV('csv/01_HTML標籤對照表.csv'),
      fetchCSV('csv/dompurify_tags.csv'),
      fetchCSV('csv/xss_tag_whitelist.csv')
    ]);
    const map01={},mapDom={},mapXss={};
    rows01.forEach(r=>map01[r['HTML標籤']]=r);
    rowsDom.forEach(r=>mapDom[r['HTML標籤']]=r);
    rowsXss.forEach(r=>mapXss[r['HTML標籤']]=r);
    const allNames=new Set([...Object.keys(map01),...Object.keys(mapDom)]);
    allTags=[];
    allNames.forEach(tag=>{
      if(!tag)return;
      const r01=map01[tag]||{},rDom=mapDom[tag]||{},rXss=mapXss[tag]||{};
      const chatOk=r01['聊天室實測']?r01['聊天室實測'].includes('✓'):null;
      const creatorOk=r01['角色介面實測']?r01['角色介面實測'].includes('✓'):null;
      const domAllow=(rDom['DOMPurify允許']||'').includes('✓');
      const xssOk=(r01['xss白名單']||'').includes('✓')||!!mapXss[tag];
      const attrs=rXss['允許屬性']||r01['xss允許屬性']||'';
      allTags.push({tag,chatOk,creatorOk,domAllow,xssOk,attrs});
    });
    allTags.sort((a,b)=>{
      const oa=statusOrder(getStatus(a)),ob=statusOrder(getStatus(b));
      return oa!==ob?oa-ob:a.tag.localeCompare(b.tag);
    });
    render();
  }catch(e){
    document.getElementById('cards').innerHTML='<div class="err">載入失敗：'+e.message+'<br>請用本機伺服器開啟（python -m http.server 8080）</div>';
  }
}

function getStatus(t){
  const c=t.chatOk,cr=t.creatorOk;
  if(c===true&&cr===true)return 'both';
  if(c===true&&cr===false)return 'chat';
  if(c===false&&cr===true)return 'creator';
  return 'deny';
}

function render(){
  const q=curQ.toLowerCase();
  const filtered=allTags.filter(t=>{
    if(q&&!t.tag.includes(q))return false;
    const s=getStatus(t);
    if(curFilter==='all')return true;
    return curFilter===s;
  });
  const cnt={both:0,creator:0,chat:0,deny:0};
  allTags.forEach(t=>{const s=getStatus(t);if(cnt[s]!==undefined)cnt[s]++;});
  document.getElementById('s-total').textContent=allTags.length;
  document.getElementById('s-both').textContent=cnt.both;
  document.getElementById('s-chat').textContent=cnt.chat;
  document.getElementById('s-creator').textContent=cnt.creator;
  document.getElementById('s-deny').textContent=cnt.deny;

  document.getElementById('empty').style.display=filtered.length?'none':'block';
  const el=document.getElementById('cards');
  if(!filtered.length){el.innerHTML='';return;}

  // 在全部模式下插入分類換行
  let prevStatus=null;
  const items=[];
  filtered.forEach(t=>{
    const s=getStatus(t);
    if(curFilter==='all'&&prevStatus!==null&&s!==prevStatus){
      items.push('<div class="cat-sep"></div>');
    }
    prevStatus=s;
    items.push(renderCard(t));
  });
  el.innerHTML=items.join('');
}

    const rawSnippet=VISUAL[t.tag]?VISUAL[t.tag][1]:`<${t.tag}>內容</${t.tag}>`;
    
    // 這裡加上了 code-wrapper 容器，將按鈕抽到 c-code 外面
    return `<div class="card ${cardCls}">
      <div class="c-head"><span class="c-name ${nc}">&lt;${esc(t.tag)}&gt;</span>${chatPill}${crPill}${denyReason}</div>
      ${attrsHtml}
      ${previewHtml}
      ${DESC[t.tag]?`<div class="c-desc">${DESC[t.tag]}</div>`:''}
      <div class="code-wrapper">
        <div class="c-code">${esc(rawSnippet)}</div>
        <button class="copy-btn" data-idx="${_snips.push(rawSnippet)-1}" onclick="copyText(_snips[+this.dataset.idx],this)">複製</button>
      </div>
    </div>`;
}

document.getElementById('q').addEventListener('input',e=>{curQ=e.target.value;render();});
document.querySelectorAll('.ft').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.ft').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');curFilter=b.dataset.f;render();
}));
init();
</script>
<script>
(function(){
  var btn=document.getElementById('themeToggle');
  var html=document.documentElement;
  var saved=localStorage.getItem('cd-theme');
  if(saved)html.setAttribute('data-theme',saved);
  else html.setAttribute('data-theme','dark');
  btn.addEventListener('click',function(){
    var next=html.getAttribute('data-theme')==='dark'?'light':'dark';
    html.setAttribute('data-theme',next);
    localStorage.setItem('cd-theme',next);
  });
})();
</script>
</body>
